<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数学建模助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1a1a2e;
      --secondary: #16213e;
      --accent: #e94560;
      --accent-glow: rgba(233, 69, 96, 0.4);
      --bg: #0f0f23;
      --text: #eaeaea;
      --text-secondary: #8892b0;
      --border: #2d2d44;
      --card-bg: rgba(26, 26, 46, 0.8);
      --radius-lg: 12px;
      --radius-md: 8px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    html, body {
      height: 100%;
      font-family: "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      height: 64px;
      padding: 0 24px;
      background: var(--primary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #ff6b6b);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .settings-btn, .clear-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .settings-btn:hover, .clear-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .clear-btn:hover {
      border-color: #e94560;
      color: #e94560;
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-left {
      border-right: 1px solid var(--border);
    }

    .panel-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .panel-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      background: var(--secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .tab:hover:not(.active) {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Input Area */
    .input-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .textarea {
      flex: 1;
      min-height: 200px;
      padding: 16px;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      line-height: 1.7;
      resize: none;
      transition: border-color 0.2s ease;
    }

    .textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .textarea::placeholder {
      color: var(--text-secondary);
    }

    /* Upload Area */
    .upload-area {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 300px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      background: var(--secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .upload-area.visible {
      display: flex;
    }

    .upload-area.dragover {
      border-color: var(--accent);
      background: rgba(233, 69, 96, 0.1);
    }

    .upload-area.has-image {
      border-style: solid;
      border-color: var(--border);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .upload-text {
      color: var(--text-secondary);
      font-size: 15px;
      text-align: center;
    }

    .upload-text span {
      color: var(--accent);
    }

    .preview-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .preview-container.visible {
      display: flex;
    }

    .preview-image {
      max-width: 100%;
      max-height: 60%;
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .preview-actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    .remove-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .remove-btn:hover {
      background: var(--accent);
      color: white;
    }

    /* Send Button */
    .send-btn {
      margin-top: 20px;
      padding: 14px 32px;
      background: var(--accent);
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .send-btn:hover:not(:disabled) {
      box-shadow: 0 0 24px var(--accent-glow);
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Response Panel */
    .response-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .response-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    .placeholder-text {
      font-size: 15px;
      text-align: center;
    }

    /* History Messages */
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 16px;
    }

    .history-item {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-user {
      background: var(--secondary);
      padding: 16px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }

    .history-user-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .history-user-text {
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .history-ai {
      padding-left: 0;
    }

    .history-ai-label {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    /* Loading State */
    .loading {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .loading.visible {
      display: flex;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Response Content */
    .response-content {
      flex: 1;
      display: none;
      overflow-y: auto;
      padding-bottom: 24px;
    }

    .response-content.visible {
      display: block;
    }

    .response-section {
      margin-bottom: 24px;
    }

    .response-section h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .response-section h3 {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    .response-section p {
      line-height: 1.8;
      color: var(--text);
      margin-bottom: 12px;
    }

    .response-section ul, .response-section ol {
      padding-left: 24px;
      margin-bottom: 12px;
    }

    .response-section li {
      line-height: 1.8;
      color: var(--text);
      margin-bottom: 6px;
    }

    .response-section code {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      background: var(--secondary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .response-section pre {
      background: var(--secondary);
      padding: 16px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .response-section pre code {
      background: none;
      padding: 0;
    }

    /* Error Message */
    .error-message {
      background: rgba(233, 69, 96, 0.1);
      border: 1px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 16px;
      color: var(--accent);
      text-align: center;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: var(--primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow);
    }

    .modal h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--text);
    }

    .modal-label {
      display: block;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .modal-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 24px;
      transition: border-color 0.2s ease;
    }

    .modal-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-input::placeholder {
      color: var(--text-secondary);
    }

    .modal-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 24px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .modal-btn-secondary:hover {
      border-color: var(--text-secondary);
      color: var(--text);
    }

    .modal-btn-primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: white;
    }

    .modal-btn-primary:hover {
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main {
        flex-direction: column;
      }

      .panel-left {
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: 50vh;
      }

      .panel-content {
        padding: 16px;
      }

      .textarea {
        min-height: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">∑</div>
        <span class="logo-text">数学建模助手</span>
      </div>
      <div class="header-actions">
        <button class="clear-btn" id="clearBtn">清空历史</button>
        <button class="settings-btn" id="settingsBtn">设置 API Key</button>
      </div>
    </header>

    <main class="main">
      <div class="panel panel-left">
        <div class="panel-header">题目输入</div>
        <div class="panel-content">
          <div class="tabs">
            <button class="tab active" data-tab="text">文字输入</button>
            <button class="tab" data-tab="image">图片上传</button>
            <button class="tab" data-tab="word">Word 文档</button>
          </div>

          <div class="input-area" id="textInput">
            <textarea class="textarea" id="questionInput" placeholder="请输入数学建模题目...

例如：
某城市需要规划快递配送路线，要求在满足配送时间窗口约束的前提下，最小化总行驶距离和车辆数量。请建立数学模型并给出求解思路。"></textarea>
          </div>

          <div class="upload-area" id="uploadArea">
            <div class="upload-placeholder" id="uploadPlaceholder">
              <div class="upload-icon">📷</div>
              <p class="upload-text">拖拽图片到此处<br>或 <span>点击上传</span></p>
            </div>
            <div class="preview-container" id="previewContainer">
              <img class="preview-image" id="previewImage" alt="预览">
              <div class="preview-actions">
                <button class="remove-btn" id="removeImage">移除图片</button>
              </div>
            </div>
          </div>

          <div class="upload-area" id="wordArea">
            <div class="upload-placeholder" id="wordPlaceholder">
              <div class="upload-icon">📄</div>
              <p class="upload-text">拖拽 Word 文档到此处<br>或 <span>点击上传</span><br><small style="color: var(--text-secondary); margin-top: 8px; display: block;">支持 .docx 格式</small></p>
            </div>
            <div class="preview-container" id="wordPreviewContainer">
              <div style="text-align: center;">
                <div style="font-size: 48px; margin-bottom: 12px;">📄</div>
                <p id="wordFileName" style="color: var(--text); margin-bottom: 8px;"></p>
                <p id="wordContentPreview" style="color: var(--text-secondary); font-size: 13px; max-height: 100px; overflow: hidden; text-overflow: ellipsis;"></p>
              </div>
              <div class="preview-actions">
                <button class="remove-btn" id="removeWord">移除文档</button>
              </div>
            </div>
          </div>

          <button class="send-btn" id="sendBtn">
            <span>开始分析</span>
            <span>→</span>
          </button>
        </div>
      </div>

      <div class="panel panel-right">
        <div class="panel-header">AI 响应</div>
        <div class="panel-content">
          <div class="response-area">
            <div class="response-placeholder" id="placeholder">
              <div class="placeholder-icon">🔍</div>
              <p class="placeholder-text">输入题目后点击"开始分析"<br>AI 将为您进行详细解读</p>
            </div>

            <div class="loading" id="loading">
              <div class="loading-spinner"></div>
              <p class="loading-text">正在分析题目...</p>
            </div>

            <div class="history-list" id="historyList"></div>

            <div class="response-content" id="responseContent"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>API Key 设置</h3>
      <label class="modal-label">AI 提供商</label>
      <select class="modal-input" id="providerSelect" style="margin-bottom: 12px; cursor: pointer;">
        <option value="minimax">Minimax</option>
        <option value="openai">OpenAI (GPT-4o)</option>
        <option value="claude">Claude (3.5 Sonnet)</option>
        <option value="deepseek">DeepSeek</option>
      </select>
      <label class="modal-label" id="apiKeyLabel">API Key</label>
      <input type="password" class="modal-input" id="apiKeyInput" placeholder="输入 API Key...">
      <p class="modal-hint" id="apiKeyHint">
        您的 API Key 仅存储在服务器数据库中。
      </p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-secondary" id="cancelBtn">取消</button>
        <button class="modal-btn modal-btn-primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const settingsBtn = document.getElementById('settingsBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const cancelBtn = document.getElementById('cancelBtn');
    const saveBtn = document.getElementById('saveBtn');
    const tabs = document.querySelectorAll('.tab');
    const textInput = document.getElementById('textInput');
    const uploadArea = document.getElementById('uploadArea');
    const questionInput = document.getElementById('questionInput');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const removeImage = document.getElementById('removeImage');
    const sendBtn = document.getElementById('sendBtn');
    const placeholder = document.getElementById('placeholder');
    const loading = document.getElementById('loading');
    const responseContent = document.getElementById('responseContent');
    const historyList = document.getElementById('historyList');

    // Word elements
    const wordArea = document.getElementById('wordArea');
    const wordPlaceholder = document.getElementById('wordPlaceholder');
    const wordPreviewContainer = document.getElementById('wordPreviewContainer');
    const wordFileName = document.getElementById('wordFileName');
    const wordContentPreview = document.getElementById('wordContentPreview');
    const removeWord = document.getElementById('removeWord');

    let sessionId = localStorage.getItem('sessionId') || '';
    let apiKey = '';
    let provider = 'minimax';
    let currentTab = 'text';
    let uploadedImage = null;
    let uploadedWord = null;
    let wordTextContent = '';

    const providerHints = {
      minimax: '请从 Minimax 开放平台获取 API Key',
      openai: '请从 OpenAI 平台获取 API Key',
      claude: '请从 Anthropic 平台获取 API Key',
      deepseek: '请从 DeepSeek 平台获取 API Key'
    };

    // Initialize
    async function init() {
      try {
        if (!sessionId) {
          const resp = await fetch('/api/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
          });
          const data = await resp.json();
          sessionId = data.sessionId;
          localStorage.setItem('sessionId', sessionId);
        } else {
          // Verify session exists
          try {
            const resp = await fetch(`/api/apikey/${sessionId}`);
            if (resp.ok) {
              const data = await resp.json();
              apiKey = data.apiKey || '';
              provider = data.provider || 'minimax';
            }
          } catch (e) {
            // Session invalid, create new one
            sessionId = '';
            localStorage.removeItem('sessionId');
          }
        }

        await loadHistory();
      } catch (e) {
        console.error('Init failed:', e);
      }
      updateTabVisibility();
    }

    async function loadHistory() {
      if (!sessionId) return;
      try {
        const resp = await fetch(`/api/history/${sessionId}`);
        if (resp.ok) {
          const history = await resp.json();
          renderHistory(history);
        }
      } catch (e) {
        console.error('加载历史失败:', e);
      }
    }

    function renderHistory(history) {
      historyList.innerHTML = '';
      if (history.length === 0) {
        placeholder.style.display = 'flex';
        return;
      }

      placeholder.style.display = 'none';

      history.forEach(item => {
        const userDiv = document.createElement('div');
        userDiv.className = 'history-item';

        let userContent = '';
        if (item.wordContent) {
          userContent += `[Word文档] ${item.wordContent.substring(0, 100)}...\n\n`;
        }
        if (item.userInput) {
          userContent += item.userInput;
        }
        if (item.imageData) {
          userContent += userContent ? '\n\n[图片]' : '[图片]';
        }

        userDiv.innerHTML = `
          <div class="history-user">
            <div class="history-user-label">你的输入</div>
            <div class="history-user-text">${escapeHtml(userContent)}</div>
          </div>
          <div class="history-ai">
            <div class="history-ai-label">AI 分析</div>
            <div class="ai-content">${renderMarkdown(item.aiResponse || '')}</div>
          </div>
        `;

        historyList.appendChild(userDiv);
        renderMath(userDiv);
      });

      // Scroll to bottom
      historyList.scrollTop = historyList.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Tab Switching
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        updateTabVisibility();
      });
    });

    function updateTabVisibility() {
      textInput.style.display = 'none';
      uploadArea.style.display = 'none';
      wordArea.style.display = 'none';

      if (currentTab === 'text') {
        textInput.style.display = 'flex';
      } else if (currentTab === 'image') {
        uploadArea.style.display = 'flex';
      } else if (currentTab === 'word') {
        wordArea.style.display = 'flex';
      }
    }

    // Settings Modal
    const providerSelect = document.getElementById('providerSelect');
    const apiKeyLabel = document.getElementById('apiKeyLabel');
    const apiKeyHint = document.getElementById('apiKeyHint');

    providerSelect.addEventListener('change', () => {
      const p = providerSelect.value;
      apiKeyHint.textContent = providerHints[p] || '';
    });

    settingsBtn.addEventListener('click', () => {
      apiKeyInput.value = apiKey;
      providerSelect.value = provider;
      apiKeyHint.textContent = providerHints[provider] || '';
      modalOverlay.classList.add('visible');
    });

    cancelBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('visible');
    });

    saveBtn.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        apiKey = key;
        provider = providerSelect.value;
        modalOverlay.classList.remove('visible');
      }
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('visible');
      }
    });

    // Clear History
    clearBtn.addEventListener('click', async () => {
      if (!confirm('确定要清空所有历史记录吗？')) return;

      try {
        await fetch(`/api/history/${sessionId}`, { method: 'DELETE' });
        historyList.innerHTML = '';
        placeholder.style.display = 'flex';
      } catch (e) {
        alert('清空失败');
      }
    });

    // Image Upload
    uploadArea.addEventListener('click', () => {
      if (!uploadedImage) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) handleImageFile(file);
        };
        input.click();
      }
    });

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleImageFile(file);
      }
    });

    function handleImageFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImage = e.target.result;
        previewImage.src = uploadedImage;
        uploadPlaceholder.style.display = 'none';
        previewContainer.classList.add('visible');
        uploadArea.classList.add('has-image');
      };
      reader.readAsDataURL(file);
    }

    removeImage.addEventListener('click', (e) => {
      e.stopPropagation();
      uploadedImage = null;
      previewImage.src = '';
      uploadPlaceholder.style.display = 'flex';
      previewContainer.classList.remove('visible');
      uploadArea.classList.remove('has-image');
    });

    // Word Upload
    wordArea.addEventListener('click', () => {
      if (!uploadedWord) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.docx';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (file) await handleWordFile(file);
        };
        input.click();
      }
    });

    wordArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      wordArea.classList.add('dragover');
    });

    wordArea.addEventListener('dragleave', () => {
      wordArea.classList.remove('dragover');
    });

    wordArea.addEventListener('drop', async (e) => {
      e.preventDefault();
      wordArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith('.docx') || file.name.endsWith('.doc'))) {
        await handleWordFile(file);
      } else {
        alert('请上传 Word 文档 (.docx 或 .doc)');
      }
    });

    async function handleWordFile(file) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        const zip = await JSZip.loadAsync(uint8Array);
        const contentXml = await zip.file('word/document.xml')?.async('string') || '';

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = contentXml;
        const extractedText = tempDiv.textContent.replace(/\s+/g, ' ').trim();

        wordTextContent = extractedText;
        uploadedWord = file;
        wordFileName.textContent = file.name;
        wordContentPreview.textContent = wordTextContent.substring(0, 200) + (wordTextContent.length > 200 ? '...' : '');
        wordPlaceholder.style.display = 'none';
        wordPreviewContainer.classList.add('visible');
        wordArea.classList.add('has-image');
      } catch (error) {
        console.error('Word 解析错误:', error);
        alert('无法解析 Word 文档，请确保是有效的 .docx 格式');
      }
    }

    removeWord.addEventListener('click', (e) => {
      e.stopPropagation();
      uploadedWord = null;
      wordTextContent = '';
      wordFileName.textContent = '';
      wordContentPreview.textContent = '';
      wordPlaceholder.style.display = 'flex';
      wordPreviewContainer.classList.remove('visible');
      wordArea.classList.remove('has-image');
    });

    // Send Message
    sendBtn.addEventListener('click', async () => {
      if (!apiKey) {
        alert('请先设置 API Key');
        modalOverlay.classList.add('visible');
        return;
      }

      const text = questionInput.value.trim();
      const imageData = uploadedImage;
      const wordContent = wordTextContent;

      const hasText = text.trim() !== '';
      const hasImage = imageData !== null;
      const hasWord = wordContent.trim() !== '';

      if (!hasText && !hasImage && !hasWord) {
        alert('请输入题目、上传图片或 Word 文档');
        return;
      }

      sendBtn.disabled = true;
      placeholder.style.display = 'none';
      responseContent.classList.remove('visible');
      loading.classList.add('visible');
      historyList.innerHTML = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            userInput: text,
            imageData: imageData,
            wordContent: wordContent,
            apiKey,
            provider
          })
        });

        if (!response.ok) {
          let errorMsg = `请求失败 (${response.status})`;
          try {
            const errorData = await response.json();
            if (errorData.error) {
              errorMsg = errorData.error;
            }
          } catch (e) {
            // response not JSON
          }
          throw new Error(errorMsg);
        }

        const data = await response.json();
        loading.classList.remove('visible');

        // Add to history display
        let userContent = '';
        if (hasWord) userContent += `[Word文档] ${wordContent.substring(0, 100)}...\n\n`;
        if (hasText) userContent += text;
        if (hasImage) userContent += (userContent ? '\n\n' : '') + '[图片]';

        const historyItem = document.createElement('div');
        historyItem.className = 'history-item';
        historyItem.innerHTML = `
          <div class="history-user">
            <div class="history-user-label">你的输入</div>
            <div class="history-user-text">${escapeHtml(userContent)}</div>
          </div>
          <div class="history-ai">
            <div class="history-ai-label">AI 分析</div>
            <div class="ai-content">${renderMarkdown(data.aiResponse || '')}</div>
          </div>
        `;
        historyList.appendChild(historyItem);
        renderMath(historyItem);

        // Clear inputs
        questionInput.value = '';
        uploadedImage = null;
        previewImage.src = '';
        uploadPlaceholder.style.display = 'flex';
        previewContainer.classList.remove('visible');
        uploadArea.classList.remove('has-image');
        uploadedWord = null;
        wordTextContent = '';
        wordFileName.textContent = '';
        wordContentPreview.textContent = '';
        wordPlaceholder.style.display = 'flex';
        wordPreviewContainer.classList.remove('visible');
        wordArea.classList.remove('has-image');

      } catch (error) {
        loading.classList.remove('visible');
        responseContent.innerHTML = `<div class="error-message">分析失败: ${error.message}</div>`;
        responseContent.classList.add('visible');
      }

      sendBtn.disabled = false;
    });

    // Markdown Renderer with KaTeX support
    function renderMarkdown(text) {
      let html = text;

      // Code blocks
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headers
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      // Lists
      html = html.replace(/^\- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
      html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

      // Paragraphs
      html = html.replace(/\n\n/g, '</p><p>');
      html = '<p>' + html + '</p>';

      // Clean up
      html = html.replace(/<p><\/p>/g, '');
      html = html.replace(/<p>(<h[123]>)/g, '$1');
      html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
      html = html.replace(/<p>(<pre>)/g, '$1');
      html = html.replace(/(<\/pre>)<\/p>/g, '$1');
      html = html.replace(/<p>(<ul>)/g, '$1');
      html = html.replace(/(<\/ul>)<\/p>/g, '$1');

      return html;
    }

    // Render KaTeX math formulas
    function renderMath(element) {
      if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(element, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });
      }
    }

    // Start
    init();
  </script>
</body>
</html>
